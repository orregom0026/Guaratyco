    <main class="tarjeta">
        <h1>Registrarse</h1>
        <p class="subtitulo">Completa tus datos para Registrarse</p>

        <form>
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
            </div>

            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
            </div>

            <div class="campo">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="Introduce aquí la contraseña" required>
            </div>

            <div class="campo">
                <label for="confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Confirma tu contraseña" required>
            </div>

            <button type="submit" class="boton">Registrarme</button>
        </form>
    </main>
